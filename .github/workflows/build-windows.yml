name: Build My Shop Inventory Manager

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure npm for Python
        run: npm config set python "${{ env.pythonLocation }}\python.exe"
        shell: pwsh
        env:
          pythonLocation: ${{ env.pythonLocation }}

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Rebuild native dependencies
        run: npx electron-builder install-app-deps
        env:
          npm_config_python: ${{ env.pythonLocation }}\python.exe

      - name: Create Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: My-Shop-Inventory-Manager-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
